<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositorio PDF IVSECALDAS | OneDrive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#"><i class="bi bi-folder-fill text-warning me-2"></i>IVSECALDAS | ARCHIVOS PDF</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" id="linkVolverPanel" href="#"><i class="bi bi-arrow-left-circle"></i> Volver al Panel Excel</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="documentos.html"><i class="bi bi-file-earmark-pdf-fill text-danger"></i> Carpeta PDF (IVSECALDAS)</a>
                </li>
            </ul>
            <div class="d-flex align-items-center text-white gap-3">
                <span class="badge bg-info text-dark" id="badgeUserDoc"></span>
                <button class="btn btn-outline-light btn-sm" onclick="AuthSession.logout()">Salir</button>
            </div>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="row g-4">
        <!-- Carga de PDF -->
        <div class="col-md-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-danger text-white fw-bold">
                    <i class="bi bi-cloud-arrow-up-fill me-1"></i> Subir PDF a OneDrive/IVSECALDAS
                </div>
                <div class="card-body">
                    <form id="pdfUploadForm">
                        <div class="mb-3">
                            <label for="pdfFileInput" class="form-label small fw-semibold">Seleccione archivo en formato PDF</label>
                            <input class="form-control" type="file" id="pdfFileInput" accept="application/pdf" required>
                        </div>
                        <button type="submit" class="btn btn-danger w-100" id="btnUploadPdf">
                            <i class="bi bi-upload me-1"></i> Cargar Archivo PDF
                        </button>
                    </form>
                    <div id="uploadStatus" class="mt-3 small"></div>
                </div>
            </div>
        </div>

        <!-- Consulta y Descarga -->
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                    <h6 class="mb-0 fw-bold"><i class="bi bi-files me-1"></i> Documentos en Carpeta IVSECALDAS</h6>
                    <input type="text" id="pdfSearch" class="form-control form-control-sm w-50" placeholder="Buscar archivo PDF...">
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Nombre del Archivo</th>
                                <th>Tamaño</th>
                                <th>Fecha</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="pdfTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Vista Previa PDF -->
<div class="modal fade" id="pdfPreviewModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="previewTitle">Vista Previa</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-0" style="height: 75vh;">
                <iframe id="pdfIframe" src="" style="width:100%; height:100%; border:none;"></iframe>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="config.js"></script>
<script>
    const currentUser = AuthSession.requireAuth(['ADMINISTRADOR', 'OPERADOR']);
    document.getElementById('badgeUserDoc').textContent = `${currentUser.NOMBRE} (${currentUser.ROL})`;
    document.getElementById('linkVolverPanel').href = currentUser.ROL === 'ADMINISTRADOR' ? 'admin.html' : 'operador.html';

    let pdfFiles = [];
    const previewModal = new bootstrap.Modal(document.getElementById('pdfPreviewModal'));

    async function loadPdfs() {
        pdfFiles = await DataService.listOneDrivePDFs();
        renderPdfTable();
    }

    function formatBytes(bytes) {
        if (!bytes) return '0 KB';
        return (bytes / 1024).toFixed(1) + ' KB';
    }

    function renderPdfTable() {
        const filter = document.getElementById('pdfSearch').value.toLowerCase();
        const tbody = document.getElementById('pdfTableBody');
        tbody.innerHTML = '';

        const filtered = pdfFiles.filter(f => f.name.toLowerCase().includes(filter));

        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted">No se encontraron archivos PDF en IVSECALDAS.</td></tr>';
            return;
        }

        filtered.forEach((file, idx) => {
            const dateStr = file.lastModified ? new Date(file.lastModified).toLocaleDateString('es-CO') : '-';
            const url = file.downloadUrl || file.dataUrl;
            tbody.innerHTML += `
                <tr>
                    <td><i class="bi bi-file-earmark-pdf-fill text-danger me-2"></i><strong>${file.name}</strong></td>
                    <td>${formatBytes(file.size)}</td>
                    <td>${dateStr}</td>
                    <td class="text-end text-nowrap">
                        <button class="btn btn-sm btn-outline-secondary me-1" onclick="previewPdf(${idx})" title="Consultar">
                            <i class="bi bi-eye"></i> Ver
                        </button>
                        <a href="${url}" download="${file.name}" target="_blank" class="btn btn-sm btn-primary" title="Descargar">
                            <i class="bi bi-download"></i> Descargar
                        </a>
                    </td>
                </tr>
            `;
        });
    }

    window.previewPdf = (idx) => {
        const file = pdfFiles[idx];
        document.getElementById('previewTitle').textContent = file.name;
        document.getElementById('pdfIframe').src = file.downloadUrl || file.dataUrl;
        previewModal.show();
    };

    document.getElementById('pdfSearch').addEventListener('input', renderPdfTable);

    document.getElementById('pdfUploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fileInput = document.getElementById('pdfFileInput');
        const file = fileInput.files[0];
        if (!file) return;

        const btn = document.getElementById('btnUploadPdf');
        const status = document.getElementById('uploadStatus');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Subiendo...';

        try {
            await DataService.uploadPDFToOneDrive(file, currentUser.NOMBRE);
            status.innerHTML = '<div class="alert alert-success py-2">Archivo PDF cargado exitosamente en IVSECALDAS.</div>';
            fileInput.value = '';
            await loadPdfs();
        } catch (err) {
            status.innerHTML = `<div class="alert alert-danger py-2">${err.message}</div>`;
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-upload me-1"></i> Cargar Archivo PDF';
        }
    });

    loadPdfs();
</script>
</body>
</html>
