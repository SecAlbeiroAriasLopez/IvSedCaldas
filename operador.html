<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Operador | IVSECALDAS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="operador.html"><i class="bi bi-person-badge-fill me-2"></i>IVSECALDAS | OPERADOR</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="operador.html"><i class="bi bi-journal-plus"></i> Mis Registros</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="documentos.html"><i class="bi bi-file-earmark-pdf-fill"></i> Carpeta PDF (IVSECALDAS)</a>
                </li>
            </ul>
            <div class="d-flex align-items-center text-white gap-3">
                <span class="badge bg-light text-primary" id="badgeOperador">OPERADOR</span>
                <button class="btn btn-outline-light btn-sm" onclick="AuthSession.logout()">
                    <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                </button>
            </div>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="row g-4">
        <!-- Formulario de ingreso restringido al usuario -->
        <div class="col-lg-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white fw-bold">
                    <i class="bi bi-plus-circle me-1"></i> Registrar Nuevo Graduado
                </div>
                <div class="card-body">
                    <div id="opAlert" class="alert alert-success d-none small py-2"></div>
                    <form id="opGraduadoForm">
                        <div class="mb-2">
                            <label class="form-label small fw-bold">Código DANE (Usuario)</label>
                            <input type="text" id="opCoddane" class="form-control form-control-sm bg-light" readonly>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold">Municipio</label>
                            <select id="opMunicipio" class="form-select form-select-sm" required></select>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold">Institución Educativa (IE)</label>
                            <input type="text" id="opIE" class="form-control form-control-sm" placeholder="Nombre de la Institución" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold">Nombre Completo del Estudiante</label>
                            <input type="text" id="opEstudiante" class="form-control form-control-sm" required>
                        </div>
                        <div class="row g-2 mb-2">
                            <div class="col-4">
                                <label class="form-label small fw-bold">Tipo DI</label>
                                <select id="opTipoDI" class="form-select form-select-sm" required>
                                    <option value="TI">TI</option>
                                    <option value="CC">CC</option>
                                    <option value="CE">CE</option>
                                    <option value="PPT">PPT</option>
                                </select>
                            </div>
                            <div class="col-8">
                                <label class="form-label small fw-bold">Número Documento</label>
                                <input type="text" id="opNumDI" class="form-control form-control-sm" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Resolución / Acta</label>
                            <input type="text" id="opResolucion" class="form-control form-control-sm" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-save me-1"></i> Guardar Registro
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Consulta de registros propios -->
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                    <h6 class="mb-0 fw-bold">Registros Asociados al Usuario: <span class="text-primary" id="lblUserFilter"></span></h6>
                    <input type="text" id="opSearch" class="form-control form-control-sm w-50" placeholder="Filtrar estudiante o documento...">
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 small">
                        <thead class="table-light">
                            <tr>
                                <th>MUNICIPIO</th>
                                <th>IE</th>
                                <th>ESTUDIANTE</th>
                                <th>DI</th>
                                <th>RESOLUCIÓN</th>
                            </tr>
                        </thead>
                        <tbody id="opTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script>
    const currentUser = AuthSession.requireAuth(['OPERADOR', 'ADMINISTRADOR']);
    let db = {};

    async function initOperador() {
        document.getElementById('badgeOperador').textContent = `Usuario: ${currentUser.NOMBRE}`;
        document.getElementById('opCoddane').value = currentUser.NOMBRE;
        document.getElementById('lblUserFilter').textContent = currentUser.NOMBRE;

        db = await DataService.loadAllData();

        // Poblar municipios desde hoja Municipio
        const selectMun = document.getElementById('opMunicipio');
        selectMun.innerHTML = '<option value="">Seleccione municipio...</option>' +
            (db.Municipio || []).map(m => `<option value="${m.MUNICIPIO}">${m.MUNICIPIO}</option>`).join('');

        // Autocompletar nombre de IE si existe en hoja Institucion
        const instMatch = (db.Institucion || []).find(i => String(i.CODDANE).trim() === currentUser.NOMBRE);
        if (instMatch) {
            document.getElementById('opIE').value = instMatch['INSTITUCIÓN'];
        }

        renderOperadorTable();
    }

    function renderOperadorTable() {
        const filter = document.getElementById('opSearch').value.toLowerCase();
        const tbody = document.getElementById('opTableBody');
        tbody.innerHTML = '';

        // Filtrar registros que correspondan al nombre de usuario (CODDANE)
        const myRows = (db.Graduados || []).filter(r =>
            String(r.CODDANE).trim().toUpperCase() === currentUser.NOMBRE.toUpperCase()
        );

        const filtered = myRows.filter(r =>
            String(r.ESTUDIANTE).toLowerCase().includes(filter) ||
            String(r['NÚMERO DI']).toLowerCase().includes(filter)
        );

        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">No hay registros asociados a este usuario.</td></tr>';
            return;
        }

        filtered.forEach(r => {
            tbody.innerHTML += `
                <tr>
                    <td>${r.MUNICIPIO}</td>
                    <td>${r.IE}</td>
                    <td class="fw-semibold">${r.ESTUDIANTE}</td>
                    <td>${r['TIPO DI']} ${r['NÚMERO DI']}</td>
                    <td><span class="badge bg-secondary">${r['RESOLUCIÓN']}</span></td>
                </tr>
            `;
        });
    }

    document.getElementById('opSearch').addEventListener('input', renderOperadorTable);

    document.getElementById('opGraduadoForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newRecord = {
            MUNICIPIO: document.getElementById('opMunicipio').value,
            CODDANE: currentUser.NOMBRE,
            IE: document.getElementById('opIE').value.trim(),
            ESTUDIANTE: document.getElementById('opEstudiante').value.trim().toUpperCase(),
            'TIPO DI': document.getElementById('opTipoDI').value,
            'NÚMERO DI': document.getElementById('opNumDI').value.trim(),
            'RESOLUCIÓN': document.getElementById('opResolucion').value.trim()
        };

        db.Graduados.push(newRecord);
        DataService.saveLocalDB(db);

        await DataService.appendRowToOneDrive('Graduados', [
            newRecord.MUNICIPIO,
            newRecord.CODDANE,
            newRecord.IE,
            newRecord.ESTUDIANTE,
            newRecord['TIPO DI'],
            newRecord['NÚMERO DI'],
            newRecord['RESOLUCIÓN']
        ]);

        const alertEl = document.getElementById('opAlert');
        alertEl.textContent = 'Registro agregado correctamente.';
        alertEl.classList.remove('d-none');
        setTimeout(() => alertEl.classList.add('d-none'), 3500);

        document.getElementById('opEstudiante').value = '';
        document.getElementById('opNumDI').value = '';
        renderOperadorTable();
    });

    initOperador();
</script>
</body>
</html>
